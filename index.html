<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>SMS Gateway · Bulk Sender Analysis</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: #f2f6fc;
      color: #1e293b;
      min-height: 100vh;
      padding: 20px 16px;
    }
    .app-container {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      gap: 22px;
      align-items: flex-start;
    }
    /* ── sidebar ── */
    .sidebar {
      flex: 0 0 420px;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: 28px;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.08), 0 4px 18px rgba(0,0,0,0.03);
      border: 1px solid rgba(200, 212, 230, 0.4);
      padding: 20px 20px 24px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: sticky;
      top: 20px;
      max-height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar.collapsed {
      flex: 0 0 64px;
      max-width: 64px;
      padding: 18px 10px;
    }
    .sidebar.collapsed .sidebar-content { display: none; }
    .sidebar.collapsed .sidebar-toggle { margin: 0; justify-content: center; }
    .sidebar.collapsed .sidebar-toggle i { transform: rotate(180deg); }
    .sidebar.collapsed .sidebar-toggle span { display: none; }

    .sidebar-toggle {
      background: rgba(248, 250, 252, 0.8);
      border: 1px solid rgba(200, 212, 230, 0.4);
      font-size: 18px;
      color: #1e293b;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 12px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-bottom: 14px;
    }
    .sidebar-toggle:hover { background: #f1f4f9; }
    .sidebar-toggle span {
      font-weight: 700;
      font-size: 15px;
      color: #0b1f33;
      white-space: nowrap;
    }
    .sidebar-toggle i { transition: transform 0.3s ease; margin-left: auto; color: #64748b; }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-right: 2px;
    }
    .sidebar-content::-webkit-scrollbar { width: 4px; }
    .sidebar-content::-webkit-scrollbar-thumb { background: #d1d9e6; border-radius: 10px; }

    .sidebar-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 4px;
    }
    .sidebar textarea {
      background: #fafcff;
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 500;
      color: #0b1a33;
      outline: none;
      width: 100%;
      min-height: 110px;
      resize: vertical;
      font-family: 'Inter', sans-serif;
      transition: 0.2s;
      line-height: 1.5;
    }
    .sidebar textarea:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.12); }
    .sidebar textarea::placeholder { color: #9aaec3; font-weight: 400; }

    .date-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .date-presets button {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 30px;
      padding: 4px 14px;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      transition: 0.15s;
      cursor: pointer;
      white-space: nowrap;
    }
    .date-presets button:hover { background: #f1f4f9; border-color: #b9c7da; }
    .date-presets button.active-preset {
      background: linear-gradient(135deg, #3b82f6, #7c6bf5);
      border-color: #3b82f6;
      color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }

    .bulk-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 2px;
    }
    .search-btn {
      background: linear-gradient(135deg, #3b82f6, #7c6bf5);
      border: none;
      padding: 10px 26px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 14px;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.25);
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3); }
    .search-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .search-btn i { font-size: 14px; }

    .total-count {
      background: #f1f5f9;
      border-radius: 40px;
      padding: 8px 18px;
      font-weight: 700;
      font-size: 20px;
      color: #0b1f33;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #e2e8f0;
    }
    .total-count i { color: #3b82f6; font-size: 16px; }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-bar .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #7c6bf5);
      width: 0%;
      transition: width 0.25s ease;
      border-radius: 10px;
    }

    .sender-breakdown {
      background: #fafcff;
      border-radius: 16px;
      padding: 10px 12px;
      border: 1px solid #e9edf4;
      max-height: 260px;
      overflow-y: auto;
    }
    .sender-breakdown::-webkit-scrollbar { width: 4px; }
    .sender-breakdown::-webkit-scrollbar-thumb { background: #d1d9e6; border-radius: 10px; }
    .sender-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px;
      border-bottom: 1px solid #edf2f7;
      font-size: 13px;
    }
    .sender-item:last-child { border-bottom: none; }
    .sender-name {
      font-weight: 600;
      color: #1e293b;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sender-name i { color: #64748b; font-size: 11px; margin-right: 6px; }
    .sender-count {
      font-weight: 700;
      color: #3b82f6;
      background: rgba(59, 130, 246, 0.08);
      padding: 2px 14px;
      border-radius: 30px;
      font-size: 12px;
      white-space: nowrap;
      margin-left: 10px;
    }
    .sender-empty, .sender-loading {
      color: #94a3b8;
      text-align: center;
      padding: 18px 0;
      font-size: 13px;
    }
    .sender-loading i { margin-right: 6px; color: #3b82f6; }

    /* ── main panel ── */
    .main-panel {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: 32px;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.08), 0 4px 18px rgba(0,0,0,0.03);
      padding: 28px 28px 24px;
      border: 1px solid rgba(200, 212, 230, 0.4);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .panel-header h1 {
      font-weight: 700;
      font-size: 24px;
      letter-spacing: -0.3px;
      color: #0b1f33;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-header h1 i {
      background: linear-gradient(135deg, #3b82f6, #7c6bf5);
      color: white;
      padding: 8px 10px;
      border-radius: 14px;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
    }
    .export-btn {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 9px 22px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #1e293b;
      cursor: pointer;
      transition: 0.2s;
    }
    .export-btn:hover { background: #e9edf4; transform: translateY(-2px); }

    .filter-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 16px 24px;
      background: rgba(248, 250, 252, 0.6);
      padding: 14px 22px;
      border-radius: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(200, 212, 230, 0.3);
    }
    .filter-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1 0 140px;
      min-width: 120px;
    }
    .filter-item label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
    }
    .filter-item input {
      background: white;
      border: 1.5px solid #e2e8f0;
      border-radius: 40px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #0b1a33;
      outline: none;
      width: 100%;
      min-height: 40px;
      transition: 0.2s;
    }
    .filter-item input:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.12); }
    .filter-item input::placeholder { color: #9aaec3; font-weight: 400; }
    .checkbox-item {
      flex-direction: row;
      align-items: center;
      gap: 10px;
      flex: 0 1 auto;
      padding-top: 4px;
    }
    .checkbox-item label {
      text-transform: none;
      font-weight: 600;
      letter-spacing: 0;
      color: #1e293b;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .checkbox-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #3b82f6;
      margin: 0;
      cursor: pointer;
    }

    /* main panel date range */
    .main-date-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
      margin-bottom: 16px;
      padding: 0 4px;
    }
    .main-date-label {
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      letter-spacing: 0.3px;
    }
    .main-date-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .main-date-presets button {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 30px;
      padding: 4px 14px;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      transition: 0.15s;
      cursor: pointer;
      white-space: nowrap;
    }
    .main-date-presets button:hover { background: #f1f4f9; border-color: #b9c7da; }
    .main-date-presets button.active-main-preset {
      background: linear-gradient(135deg, #3b82f6, #7c6bf5);
      border-color: #3b82f6;
      color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }
    .main-range-label {
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
    }

    .table-wrapper {
      border-radius: 18px;
      border: 1px solid #e9edf4;
      overflow-x: auto;
      background: #ffffff;
      -webkit-overflow-scrolling: touch;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 560px;
    }
    th {
      text-align: left;
      padding: 14px 12px;
      background: #f8fafc;
      font-weight: 700;
      color: #1e293b;
      border-bottom: 2px solid #e2e8f0;
      font-size: 11px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    td {
      padding: 12px 12px;
      border-bottom: 1px solid #eef2f6;
      color: #1e293b;
      vertical-align: middle;
      line-height: 1.4;
    }
    tr:hover td { background: #fafdff; }
    tr:last-child td { border-bottom: none; }

    .datetime-cell {
      display: flex;
      flex-direction: column;
      line-height: 1.3;
      font-size: 12px;
    }
    .datetime-cell .date { font-weight: 600; color: #0b1f33; }
    .datetime-cell .time { color: #64748b; font-size: 11px; }

    .text-cell {
      max-width: 320px;
      word-break: break-word;
      white-space: normal;
      line-height: 1.5;
      font-size: 13px;
    }
    .text-cell .text-content { display: block; max-width: 100%; font-weight: 500; color: #0b1f33; }
    .service-col { color: #475569; font-weight: 500; }
    .source-col { font-weight: 600; color: #3b82f6; }

    .table-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px 6px 14px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .table-header-row .record-count {
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      background: #f1f5f9;
      padding: 4px 18px;
      border-radius: 30px;
      white-space: nowrap;
      border: 1px solid #e9edf4;
    }
    .table-header-row .record-count i { margin-right: 6px; color: #3b82f6; font-size: 12px; }

    .pagination-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 4px 2px 4px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .pagination-bar span { color: #64748b; font-size: 13px; }
    .pagination-buttons { display: flex; gap: 5px; }
    .pagination-buttons button {
      background: white;
      border: 1.5px solid #e2e8f0;
      border-radius: 30px;
      padding: 5px 14px;
      font-weight: 600;
      font-size: 13px;
      color: #1e293b;
      cursor: pointer;
      transition: 0.15s;
      min-width: 34px;
    }
    .pagination-buttons button.active-page {
      background: linear-gradient(135deg, #3b82f6, #7c6bf5);
      border-color: #3b82f6;
      color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
    }
    .pagination-buttons button:hover:not(.active-page) {
      background: #f1f5f9;
      border-color: #b9c7da;
    }

    .footer-bar {
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      border-top: 1px solid #eef2f6;
      padding-top: 18px;
    }
    .footer-bar span { color: #64748b; }

    @media (max-width: 1024px) {
      .app-container { flex-direction: column; }
      .sidebar {
        flex: 1 1 auto !important;
        max-width: 100% !important;
        position: static !important;
        max-height: none !important;
        width: 100%;
      }
      .sidebar.collapsed {
        flex: 0 0 64px !important;
        max-width: 100% !important;
      }
    }
    @media (max-width: 680px) {
      body { padding: 12px 6px; }
      .main-panel { padding: 18px 14px; border-radius: 24px; }
      .panel-header h1 { font-size: 19px; }
      .filter-grid { padding: 14px; gap: 12px; border-radius: 18px; }
      .filter-item { flex: 1 0 100%; min-width: 0; }
      .checkbox-item { flex: 0 1 auto; }
      table { font-size: 12px; min-width: 420px; }
      th { padding: 10px 8px; font-size: 10px; }
      td { padding: 10px 8px; }
      .sidebar { padding: 16px; }
      .sidebar textarea { min-height: 80px; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-toggle" id="sidebarToggle">
      <i class="fas fa-chevron-left"></i>
      <span>Bulk Analysis</span>
    </button>
    <div class="sidebar-content">
      <div>
        <div class="sidebar-title">Paste Numbers (one per line)</div>
        <textarea id="bulkNumbers" placeholder="+923001234567&#10;+923001234568&#10;+923001234569">+923001234567
+923001234568
+923001234569</textarea>
      </div>
      <div>
        <div class="sidebar-title">Bulk Date Range</div>
        <div class="date-presets" id="presetContainer">
          <button data-preset="today">Today</button>
          <button data-preset="yesterday">Yesterday</button>
          <button data-preset="last7">Last 7</button>
          <button data-preset="last30" class="active-preset">Last 30</button>
          <button data-preset="thisMonth">This Month</button>
          <button data-preset="lastMonth">Last Month</button>
        </div>
        <div style="margin-top: 5px; font-size: 12px; color: #64748b;" id="rangeLabel">Last 30 Days</div>
      </div>
      <div>
        <div class="bulk-actions">
          <button class="search-btn" id="bulkSearchBtn"><i class="fas fa-search"></i> Analyze</button>
          <div class="total-count"><i class="fas fa-hashtag"></i> <span id="bulkCount">0</span></div>
        </div>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div>
        <div class="sidebar-title">Sender Breakdown</div>
        <div class="sender-breakdown" id="senderBreakdown">
          <div class="sender-empty">No data yet. Run analysis.</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN PANEL -->
  <main class="main-panel">
    <div class="panel-header">
      <h1><i class="fas fa-sms"></i> SMS Gateway</h1>
      <button class="export-btn" id="exportBtn"><i class="fas fa-download"></i> Export CSV</button>
    </div>

    <!-- Main date range (separate from bulk) -->
    <div class="main-date-row">
      <span class="main-date-label">Date Range</span>
      <div class="main-date-presets" id="mainPresetContainer">
        <button data-preset="today">Today</button>
        <button data-preset="yesterday">Yesterday</button>
        <button data-preset="last7">Last 7</button>
        <button data-preset="last30" class="active-main-preset">Last 30</button>
        <button data-preset="thisMonth">This Month</button>
        <button data-preset="lastMonth">Last Month</button>
      </div>
      <span class="main-range-label" id="mainRangeLabel">Last 30 Days</span>
    </div>

    <div class="filter-grid">
      <div class="filter-item">
        <label>Destination</label>
        <input type="text" id="destinationInput" placeholder="Enter phone number" value="">
      </div>
      <div class="filter-item checkbox-item">
        <label><input type="checkbox" id="dupCheckbox" checked> Duplicates</label>
      </div>
    </div>

    <div class="table-wrapper">
      <div class="table-header-row">
        <span></span>
        <span class="record-count" id="recordCountTop">
          <i class="fas fa-envelope"></i> <span id="recordCountText">0 – 0 of 0</span>
        </span>
      </div>
      <table>
        <thead><tr><th>Time</th><th>Service</th><th>Source</th><th>Destination</th><th>Text</th></tr></thead>
        <tbody id="smsTableBody">
          <tr><td colspan="5" style="text-align:center; padding:40px; color:#94a3b8;">
            <i class="fas fa-phone" style="margin-right:8px; color:#3b82f6;"></i>
            Enter a phone number to load SMS records
          </td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination-bar">
      <span></span>
      <div class="pagination-buttons">
        <button id="prevPage"><i class="fas fa-chevron-left"></i></button>
        <button class="active-page" id="pageIndicator">1</button>
        <button id="nextPage"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
    <div class="footer-bar"><span>Copyright © 2026. All rights reserved.</span></div>
  </main>
</div>

<script>
  (function() {
    const API_BASE = 'https://zatech-backend.onrender.com/api/sms';

    // ── state ──
    const state = {
      page: 1,
      perPage: 20,
      total: 0,
      data: [],
      destination: '',
      dup: true,
      // main (gateway) date range
      mainTimeStart: null,
      mainTimeEnd: null,
      // bulk date range
      bulkTimeStart: null,
      bulkTimeEnd: null,
      order: 'id:desc',
      loading: false,
      senderMap: {},
      totalBulkCount: 0
    };

    // ── DOM refs ──
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const bulkTextarea = document.getElementById('bulkNumbers');
    const bulkSearchBtn = document.getElementById('bulkSearchBtn');
    const bulkCountSpan = document.getElementById('bulkCount');
    const senderBreakdown = document.getElementById('senderBreakdown');
    const progressFill = document.getElementById('progressFill');
    const rangeLabel = document.getElementById('rangeLabel');
    const mainRangeLabel = document.getElementById('mainRangeLabel');
    const destInput = document.getElementById('destinationInput');
    const dupCheck = document.getElementById('dupCheckbox');
    const tbody = document.getElementById('smsTableBody');
    const recordCountText = document.getElementById('recordCountText');
    const pageIndicator = document.getElementById('pageIndicator');
    const prevBtn = document.getElementById('prevPage');
    const nextBtn = document.getElementById('nextPage');

    // ── 5am‑based date helpers ──
    function get5amDate(date) {
      const d = new Date(date);
      d.setHours(5, 0, 0, 0);
      return d;
    }

    function getPresetDates(preset) {
      const now = new Date();
      const today5am = get5amDate(now);
      const yesterday5am = get5amDate(new Date(now.getTime() - 86400000));
      let start, end, label;

      switch(preset) {
        case 'today': {
          start = new Date(today5am);
          end = new Date(today5am);
          end.setDate(end.getDate() + 1);
          end.setHours(5, 0, 0, 0);
          label = 'Today';
          break;
        }
        case 'yesterday': {
          start = new Date(yesterday5am);
          end = new Date(today5am);
          label = 'Yesterday';
          break;
        }
        case 'last7': {
          start = new Date(today5am);
          start.setDate(start.getDate() - 7);
          end = new Date(today5am);
          label = 'Last 7 Days';
          break;
        }
        case 'last30': {
          start = new Date(today5am);
          start.setDate(start.getDate() - 30);
          end = new Date(today5am);
          label = 'Last 30 Days';
          break;
        }
        case 'thisMonth': {
          const firstOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
          start = get5amDate(firstOfMonth);
          end = new Date(today5am);
          label = 'This Month';
          break;
        }
        case 'lastMonth': {
          const firstOfLast = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          const lastOfLast = new Date(now.getFullYear(), now.getMonth(), 1);
          start = get5amDate(firstOfLast);
          end = get5amDate(lastOfLast);
          label = 'Last Month';
          break;
        }
        default: return null;
      }
      if (end <= start) {
        end = new Date(start);
        end.setDate(end.getDate() + 1);
      }
      return { start, end, label };
    }

    function formatDateForAPI(d) {
      if (!d) return '';
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const h = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${y}-${m}-${day}.${h}.${min}`;
    }

    // ── parse SMS data from ZATECH format ──
    function parseSMSDataFromZatech(data) {
      if (!data || !data.data || !data.data.data) return [];
      return data.data.data.map(item => ({
        id: item._id || '',
        service: item.from || '',
        source: item.from || '',
        destination: item.to || '',
        text: item.message || '',
        provider: '',
        time: item.createdAt || '',
        time_received: item.createdAt || ''
      }));
    }

    // ── fetch for table (uses main date range) ──
    async function fetchSMS(destOverride = null) {
      const rawDest = destOverride !== null ? destOverride : destInput.value.trim().replace(/^\+/, '');
      const effectiveDest = rawDest || state.destination;
      if (!effectiveDest) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:40px; color:#94a3b8;">
          <i class="fas fa-phone" style="margin-right:8px; color:#3b82f6;"></i> Enter a phone number to load SMS records
        </td></tr>`;
        recordCountText.textContent = '0 – 0 of 0';
        pageIndicator.textContent = '1';
        state.data = [];
        state.total = 0;
        return [];
      }
      if (state.loading) return [];
      state.loading = true;
      state.destination = effectiveDest;
      state.dup = dupCheck.checked;

      // Format dates for ZATECH API
      const startDate = state.mainTimeStart ? state.mainTimeStart.toISOString() : '';
      const endDate = state.mainTimeEnd ? state.mainTimeEnd.toISOString() : '';

      const params = new URLSearchParams();
      params.set('query', effectiveDest);
      params.set('page', state.page);
      if (startDate) params.set('startDate', startDate);
      if (endDate) params.set('endDate', endDate);

      try {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:30px; color:#94a3b8;">
          <i class="fas fa-spinner fa-spin" style="color:#3b82f6;"></i> Loading ...
        </td></tr>`;
        const resp = await fetch(`${API_BASE}?${params.toString()}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const json = await resp.json();
        
        let parsed = parseSMSDataFromZatech(json);
        if (!state.dup) {
          const seen = new Set();
          parsed = parsed.filter(r => {
            const key = r.text + '|' + r.source;
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
          });
        }
        state.total = json.data?.totalResults || parsed.length;
        const start = (state.page - 1) * state.perPage;
        const end = Math.min(start + state.perPage, state.total);
        state.data = parsed.slice(start, end);
        return state.data;
      } catch (err) {
        console.error('Fetch error:', err);
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:30px; color:#ef4444;">
          <i class="fas fa-exclamation-circle"></i> Error: ${err.message}
        </td></tr>`;
        state.data = [];
        state.total = 0;
        return [];
      } finally {
        state.loading = false;
      }
    }

    function renderTable() {
      const rows = state.data;
      if (!rows || rows.length === 0) {
        const hasDest = destInput.value.trim().length > 0 || state.destination;
        if (hasDest) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:30px; color:#94a3b8;">No SMS records found</td></tr>`;
        }
        recordCountText.textContent = '0 – 0 of 0';
        pageIndicator.textContent = '1';
        return;
      }
      let html = '';
      rows.forEach(r => {
        const { date, time } = splitDateTime(r.time);
        html += `<tr>
          <td><div class="datetime-cell"><span class="date">${date}</span><span class="time">${time}</span></div></td>
          <td class="service-col">${r.service || 'N/A'}</td>
          <td class="source-col">${r.source || 'N/A'}</td>
          <td>${r.destination || 'N/A'}</td>
          <td><div class="text-cell"><span class="text-content">${r.text || ''}</span></div></td>
        </tr>`;
      });
      tbody.innerHTML = html;
      const start = (state.page - 1) * state.perPage + 1;
      const end = Math.min(state.page * state.perPage, state.total);
      recordCountText.textContent = `${start} – ${end} of ${state.total}`;
      pageIndicator.textContent = state.page;
    }

    async function refreshTable(destOverride = null) {
      await fetchSMS(destOverride);
      renderTable();
    }

    // ── BULK ANALYSIS (uses bulk date range) ──
    async function runBulkAnalysis() {
      const raw = bulkTextarea.value;
      const numbers = raw.split('\n').map(s => s.trim().replace(/^\+/, '')).filter(s => s.length > 0);
      if (numbers.length === 0) {
        alert('Please paste at least one phone number.');
        return;
      }

      bulkSearchBtn.disabled = true;
      bulkSearchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analyzing...';
      progressFill.style.width = '0%';
      senderBreakdown.innerHTML = '<div class="sender-loading"><i class="fas fa-spinner fa-spin"></i> Fetching data...</div>';

      const startDate = state.bulkTimeStart ? state.bulkTimeStart.toISOString() : '';
      const endDate = state.bulkTimeEnd ? state.bulkTimeEnd.toISOString() : '';

      const senderMap = {};
      let totalCount = 0;
      const total = numbers.length;
      const concurrency = 5;
      const batches = [];
      for (let i = 0; i < numbers.length; i += concurrency) {
        batches.push(numbers.slice(i, i + concurrency));
      }

      let completed = 0;
      for (const batch of batches) {
        const batchPromises = batch.map(async (num) => {
          try {
            const params = new URLSearchParams();
            params.set('query', num);
            params.set('page', 1);
            if (startDate) params.set('startDate', startDate);
            if (endDate) params.set('endDate', endDate);
            
            const resp = await fetch(`${API_BASE}?${params.toString()}`);
            if (!resp.ok) return { num, records: [], error: true };
            const json = await resp.json();
            const parsed = parseSMSDataFromZatech(json);
            return { num, records: parsed, error: false };
          } catch (e) {
            return { num, records: [], error: true };
          }
        });

        const batchResults = await Promise.all(batchPromises);
        completed += batch.length;
        const pct = Math.min(100, (completed / total) * 100);
        progressFill.style.width = pct + '%';

        for (const result of batchResults) {
          if (!result.error && result.records.length > 0) {
            totalCount += result.records.length;
            for (const rec of result.records) {
              const sender = rec.source || 'unknown';
              senderMap[sender] = (senderMap[sender] || 0) + 1;
            }
          }
        }
        updateSenderBreakdown(senderMap, totalCount);
        bulkCountSpan.textContent = totalCount.toLocaleString();
      }

      state.senderMap = senderMap;
      state.totalBulkCount = totalCount;
      bulkCountSpan.textContent = totalCount.toLocaleString();
      updateSenderBreakdown(senderMap, totalCount);

      if (numbers.length > 0) {
        destInput.value = numbers[0];
        await refreshTable(numbers[0]);
      }

      bulkSearchBtn.disabled = false;
      bulkSearchBtn.innerHTML = '<i class="fas fa-search"></i> Analyze';
      progressFill.style.width = '100%';
      setTimeout(() => { progressFill.style.width = '0%'; }, 2000);
    }

    function updateSenderBreakdown(senderMap, total) {
      if (Object.keys(senderMap).length === 0) {
        senderBreakdown.innerHTML = '<div class="sender-empty">No sender data found</div>';
        return;
      }
      const sorted = Object.entries(senderMap).sort((a, b) => b[1] - a[1]);
      let html = '';
      sorted.forEach(([sender, count]) => {
        html += `<div class="sender-item">
          <span class="sender-name"><i class="fas fa-user"></i> ${sender}</span>
          <span class="sender-count">${count.toLocaleString()}</span>
        </div>`;
      });
      senderBreakdown.innerHTML = html;
    }

    // ── presets ──
    function setMainPreset(preset) {
      const result = getPresetDates(preset);
      if (!result) return;
      state.mainTimeStart = result.start;
      state.mainTimeEnd = result.end;
      mainRangeLabel.textContent = result.label;
      document.querySelectorAll('.main-date-presets button').forEach(b => {
        b.classList.toggle('active-main-preset', b.dataset.preset === preset);
      });
      const val = destInput.value.trim().replace(/^\+/, '');
      if (val) refreshTable(val);
    }

    function setBulkPreset(preset) {
      const result = getPresetDates(preset);
      if (!result) return;
      state.bulkTimeStart = result.start;
      state.bulkTimeEnd = result.end;
      rangeLabel.textContent = result.label;
      document.querySelectorAll('#presetContainer button').forEach(b => {
        b.classList.toggle('active-preset', b.dataset.preset === preset);
      });
    }

    // ── pagination ──
    function changePage(delta) {
      const newPage = state.page + delta;
      if (newPage < 1) return;
      const maxPage = Math.ceil(state.total / state.perPage) || 1;
      if (newPage > maxPage) return;
      state.page = newPage;
      const val = destInput.value.trim().replace(/^\+/, '') || state.destination;
      if (val) refreshTable(val);
    }

    // ── events ──
    function bindEvents() {
      sidebarToggle.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
        const icon = sidebarToggle.querySelector('i');
        icon.className = sidebar.classList.contains('collapsed') ? 'fas fa-chevron-right' : 'fas fa-chevron-left';
      });

      destInput.addEventListener('change', () => {
        const val = destInput.value.trim().replace(/^\+/, '');
        if (val) refreshTable(val);
      });
      destInput.addEventListener('keypress', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const val = destInput.value.trim().replace(/^\+/, '');
          if (val) refreshTable(val);
        }
      });

      dupCheck.addEventListener('change', () => {
        const val = destInput.value.trim().replace(/^\+/, '');
        if (val) refreshTable(val);
      });

      // Main presets
      document.querySelectorAll('.main-date-presets button').forEach(btn => {
        btn.addEventListener('click', e => {
          e.preventDefault();
          setMainPreset(btn.dataset.preset);
        });
      });

      // Bulk presets
      document.querySelectorAll('#presetContainer button').forEach(btn => {
        btn.addEventListener('click', e => {
          e.preventDefault();
          setBulkPreset(btn.dataset.preset);
        });
      });

      prevBtn.addEventListener('click', () => changePage(-1));
      nextBtn.addEventListener('click', () => changePage(1));

      document.getElementById('exportBtn').addEventListener('click', function() {
        if (state.data.length === 0) { alert('No data to export'); return; }
        let csv = 'Time,Service,Source,Destination,Text\n';
        state.data.forEach(r => {
          csv += `"${r.time || ''}","${r.service || ''}","${r.source || ''}","${r.destination || ''}","${r.text || ''}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `sms_${state.destination || 'bulk'}_${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      });

      bulkSearchBtn.addEventListener('click', runBulkAnalysis);
    }

    // ── init ──
    function init() {
      // Main default
      const mainDefault = 'last30';
      const mainResult = getPresetDates(mainDefault);
      if (mainResult) {
        state.mainTimeStart = mainResult.start;
        state.mainTimeEnd = mainResult.end;
        mainRangeLabel.textContent = mainResult.label;
      }
      // Bulk default
      const bulkDefault = 'last30';
      const bulkResult = getPresetDates(bulkDefault);
      if (bulkResult) {
        state.bulkTimeStart = bulkResult.start;
        state.bulkTimeEnd = bulkResult.end;
        rangeLabel.textContent = bulkResult.label;
      }

      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:40px; color:#94a3b8;">
        <i class="fas fa-phone" style="margin-right:8px; color:#3b82f6;"></i> Enter a phone number to load SMS records
      </td></tr>`;
      recordCountText.textContent = '0 – 0 of 0';
      pageIndicator.textContent = '1';
      bulkCountSpan.textContent = '0';
      senderBreakdown.innerHTML = '<div class="sender-empty">No data yet. Run analysis.</div>';
      bindEvents();
    }

    init();
  })();
</script>
</body>
</html>
